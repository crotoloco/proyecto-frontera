<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Centro de Control</title>
  <style>
	body{font-family:Segoe UI,Arial,sans-serif;background:#f4f7f6;color:#172a2b;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
	.card{background:#fff;padding:28px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,0.08);width:360px}
	input{width:100%;padding:10px;margin:8px 0;border:1px solid #d6e2dc;border-radius:8px}
	button{width:100%;padding:10px;background:#087c78;color:#fff;border:0;border-radius:8px;font-weight:700}
	.error{color:#a13f36;margin-bottom:12px}
	.success{color:#176b45;background:#e5f5ec;padding:10px;border-radius:8px;margin-bottom:12px}
	a{color:#087c78;text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
	<h2>Iniciar sesión</h2>
	{% if error %}<div class="error">{{ error }}</div>{% endif %}
	{% if request.args.get('registered') %}<div class="success">Cuenta creada. Ya podés iniciar sesión.</div>{% endif %}
	<form method="post">
		<input type="hidden" name="next" value="{{ next }}">
	  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
	  <label>Usuario<input type="text" name="user" required></label>
	  <label>Contraseña<input type="password" name="password" required></label>
	  <button type="submit">Entrar</button>
	</form>
	<p style="margin-top:16px;font-size:14px;text-align:center">¿No tenés una cuenta? <a href="{{ url_for('register', next=next) }}">Crear cuenta</a></p>
	<p style="margin-top:12px;font-size:13px;color:#667779">Credenciales por defecto: <strong>admin / admin</strong> (usar sólo en desarrollo).</p>
  </div>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Crear usuario</title>
  <style>
	body{font-family:Segoe UI,Arial,sans-serif;background:#f6fbf9;color:#172a2b;margin:0;padding:24px}
	main{max-width:600px;margin:auto}
	label{display:block;margin:8px 0}
	input[type=text], input[type=password]{width:100%;padding:8px;border:1px solid #d6e2dc;border-radius:6px}
	button{background:#087c78;color:#fff;padding:8px 12px;border:0;border-radius:6px}
  </style>
</head>
<body>
<main>
  <h1>Crear usuario</h1>
  <form method="post">
	<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
	<label>Usuario<input type="text" name="username" required></label>
	<label>Contraseña<input type="password" name="password" required></label>
	<label><input type="checkbox" name="is_admin"> Administrador</label>
	<button type="submit">Crear</button>
  </form>
</main>
</body>
</html>

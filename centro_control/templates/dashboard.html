<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frontera Living · Ventas reales</title>
  <style>
	:root {
	  --bg: #dfe4e1;
	  --panel: rgba(255,255,255,0.7);
	  --soft: #f3f3f3;
	  --line: #cfcfcf;
	  --text: #2f2f2f;
	  --muted: #5d5d5d;
	  --tab: #e5e5e5;
	  --tab-active: #2e2e2e;
	  --tab-text-active: #ffffff;
	  --primary: #1b4d7a;
	  --red: #d5524d;
	  --orange: #d59b3d;
	  --gold: #d6b16d;
	  --light: #d9d9d9;
	  --green: #3d8d5b;
	  --dark: #3b3b3b;
	}

	* { box-sizing: border-box; }

	body {
	  margin: 0;
	  font-family: Arial, Helvetica, sans-serif;
	  background: var(--bg);
	  color: var(--text);
	}

	.topbar {
	  height: 48px;
	  background: #dfe2d9;
	  border-bottom: 1px solid #bfc7bf;
	  display: flex;
	  align-items: center;
	  justify-content: space-between;
	  padding: 0 16px;
	  font-size: 11px;
	  color: #4c4c4c;
	}

	.logo-container {
	  height: 40px;
	  display: flex;
	  align-items: center;
	}

	.logo-container img {
	  max-height: 40px;
	  width: auto;
	  margin-right: 12px;
	}

	.topbar .left {
	  display: flex;
	  align-items: center;
	  gap: 8px;
	}

	.dot {
	  width: 11px;
	  height: 11px;
	  border-radius: 2px;
	  border: 1px solid #888;
	  background: #f1f1f1;
	  display: inline-block;
	}

	.topbar .right {
	  display: flex;
	  align-items: center;
	  gap: 16px;
	}

	.page {
	  max-width: 1120px;
	  margin: 18px auto 30px;
	  padding: 8px 14px 14px;
	  background: rgba(255,255,255,0.22);
	  border-radius: 3px;
	}

	.container {
	  background: rgba(255,255,255,0.18);
	  border: 1px solid rgba(125, 125, 125, 0.2);
	  min-height: 760px;
	  padding: 18px 18px 0;
	  box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
	}

	.title {
	  text-align: left;
	  padding: 6px 10px 0;
	  font-size: 14px;
	  font-weight: 700;
	  color: #303030;
	  margin: 0 0 10px;
	}

	.title small {
	  display: block;
	  font-size: 11px;
	  color: #666;
	  font-weight: normal;
	  margin-top: 2px;
	}

	.tabs {
	  display: flex;
	  flex-wrap: wrap;
	  gap: 8px;
	  padding: 0 10px 14px;
	  border-bottom: 1px solid var(--line);
	}

	.tab {
	  background: var(--tab);
	  border: 1px solid #c8c8c8;
	  border-radius: 3px;
	  padding: 7px 12px;
	  font-size: 11px;
	  color: #4a4a4a;
	  line-height: 1;
	  min-width: 40px;
	  text-align: center;
	}

	.tab.active {
	  background: var(--tab-active);
	  color: var(--tab-text-active);
	  border-color: #222;
	  box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
	}

	.subtabs {
	  display: flex;
	  gap: 18px;
	  flex-wrap: wrap;
	  padding: 12px 10px 0;
	  font-size: 11px;
	  color: #4d4d4d;
	  border-bottom: 1px solid #d7d7d7;
	}

	.subtabs .tab-item {
	  padding: 0 0 9px;
	  position: relative;
	  cursor: pointer;
	  transition: all 0.2s ease;
	}

	.subtabs .tab-item.active {
	  font-weight: 600;
	  color: #222;
	}

	.subtabs .tab-item.active::after {
	  content: "";
	  position: absolute;
	  left: 0;
	  right: 0;
	  bottom: -1px;
	  height: 2px;
	  background: #1f1f1f;
	}

	.section {
	  padding: 14px 10px 0;
	}

	.module-panel {
	  display: none;
	  animation: fadeIn 0.25s ease;
	}

	.module-panel.active {
	  display: block;
	}

	@keyframes fadeIn {
	  from { opacity: 0; transform: translateY(6px); }
	  to { opacity: 1; transform: translateY(0); }
	}

	.info-line {
	  display: flex;
	  align-items: center;
	  justify-content: space-between;
	  font-size: 11px;
	  color: #626262;
	  background: rgba(255,255,255,0.2);
	  border: 1px solid #d1d1d1;
	  border-radius: 3px;
	  padding: 8px 10px;
	  margin-bottom: 12px;
	}

	.progress-wrap {
	  margin-top: 8px;
	}

	.progress-label {
	  display: flex;
	  justify-content: space-between;
	  font-size: 12px;
	  color: #363636;
	  margin-bottom: 3px;
	}

	.progress {
	  width: 100%;
	  height: 14px;
	  border-radius: 7px;
	  background: #e0e0e0;
	  border: 1px solid #c8c8c8;
	  overflow: hidden;
	  position: relative;
	}

	.progress > span {
	  display: block;
	  height: 100%;
	  border-radius: 7px;
	  background: linear-gradient(90deg, #1d5c8f, #2a7bb8);
	  width: 100%;
	}

	.summary-grid {
	  display: grid;
	  grid-template-columns: repeat(3, minmax(180px, 1fr));
	  gap: 14px;
	  margin-top: 18px;
	}

	.metric {
	  background: rgba(255,255,255,0.25);
	  border: 1px solid #d2d2d2;
	  border-radius: 3px;
	  padding: 10px 12px 8px;
	  min-height: 86px;
	  position: relative;
	  box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
	}

	.metric h4 {
	  margin: 0 0 8px 0;
	  font-size: 11px;
	  color: #4a4a4a;
	  font-weight: 700;
	  text-transform: uppercase;
	  letter-spacing: 0.02em;
	}

	.metric .value {
	  font-size: 20px;
	  font-weight: 700;
	  color: #1c1c1c;
	  line-height: 1.1;
	  margin-bottom: 6px;
	}

	.metric .sub {
	  font-size: 11px;
	  color: #4e4e4e;
	}

	.metric .trend {
	  font-size: 11px;
	  color: #5a7a55;
	  font-weight: 700;
	  margin-top: 6px;
	}

	.metric .trend.down { color: #a03939; }

	.metric .target {
	  position: absolute;
	  bottom: 7px;
	  right: 12px;
	  font-size: 10px;
	  color: #666;
	  font-weight: 600;
	}

	.bars-block {
	  margin-top: 18px;
	  padding-top: 10px;
	  border-top: 1px solid #d9d9d9;
	}

	.bars-header {
	  display: flex;
	  justify-content: space-between;
	  align-items: center;
	  font-size: 11px;
	  color: #444;
	  margin-bottom: 10px;
	  font-weight: 700;
	}

	.bar-row {
	  display: grid;
	  grid-template-columns: 150px 1fr 90px;
	  align-items: center;
	  gap: 10px;
	  font-size: 11px;
	  margin: 8px 0;
	  color: #3f3f3f;
	}

	.bar-row .label {
	  font-weight: 600;
	}

	.mini-progress {
	  width: 100%;
	  height: 12px;
	  background: #e0e0e0;
	  border-radius: 6px;
	  overflow: hidden;
	  border: 1px solid #c8c8c8;
	  position: relative;
	}

	.mini-progress span {
	  display: block;
	  height: 100%;
	  border-radius: 6px;
	}

	.red { background: linear-gradient(90deg, #d15a4e, #ed6b5f); }
	.orange { background: linear-gradient(90deg, #d59b3d, #e6b75a); }
	.green { background: linear-gradient(90deg, #3d8d5b, #69a57a); }

	/* remaining original CSS... */
  </style>
</head>
<body>
  {% if alerts %}
  <div style="padding:12px;background:#fff;border-bottom:1px solid #e6efe9">
	<h3 style="margin:0 0 8px 0">Alertas recientes</h3>
	{% for a in alerts %}
	  <div style='padding:8px;border:1px solid #eee;margin-bottom:8px;border-radius:6px;display:flex;justify-content:space-between;align-items:flex-start'>
		<div>
		  <strong>{{ a['tipo_alerta'] }}</strong> - <small style='color:#666'>{{ a['timestamp'] }}</small>
		  <div style='margin-top:6px'>{{ a['mensaje'] }}</div>
		</div>
		<div style='text-align:right'>
		  {% if a['upload_id'] %}
			<div style='margin-bottom:6px'><a href="{{ url_for('history_detail', upload_id=a['upload_id']) }}">Ver detalle</a></div>
		  {% endif %}
			<form method="post" action="/centro_control/alerts/{{ a['id'] }}/ack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit">Marcar como leída</button></form>
		</div>
	  </div>
	{% endfor %}
  </div>
  {% else %}
  <div style="padding:12px;background:#fff;border-bottom:1px solid #e6efe9"><strong>No hay alertas pendientes.</strong></div>
  {% endif %}

  <!-- Insertar aquí el contenido HTML del dashboard original -->
  {% include 'dashboard_full.html' %}

</body>
</html>
